<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CNC — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0f0d1c;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-wrap{width:100%;max-width:400px}
.brand{text-align:center;margin-bottom:32px}
.brand-logo{width:72px;height:72px;background:linear-gradient(135deg,#534AB7,#7F77DD);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px}
.brand-name{font-size:22px;font-weight:600;color:#fff;letter-spacing:-.3px}
.brand-sub{font-size:13px;color:rgba(255,255,255,.45);margin-top:4px}
.card{background:#1a1730;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:32px}
.card-title{font-size:16px;font-weight:600;color:#fff;margin-bottom:4px}
.card-sub{font-size:13px;color:rgba(255,255,255,.45);margin-bottom:24px}
.form-group{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:500;color:rgba(255,255,255,.6);margin-bottom:6px;letter-spacing:.02em}
input{width:100%;padding:10px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;font-size:14px;font-family:inherit;transition:border-color .15s}
input:focus{outline:none;border-color:#7F77DD}
input::placeholder{color:rgba(255,255,255,.25)}
.btn-login{width:100%;padding:12px;background:#534AB7;border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;transition:background .15s}
.btn-login:hover{background:#3C3489}
.error{background:rgba(163,45,45,.2);border:1px solid rgba(163,45,45,.4);color:#f09595;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
.demo-hint{margin-top:20px;background:rgba(83,74,183,.15);border:1px solid rgba(83,74,183,.3);border-radius:10px;padding:14px}
.demo-hint p{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px;font-weight:500}
.demo-row{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.35);padding:2px 0;cursor:pointer;transition:color .12s}
.demo-row:hover{color:rgba(255,255,255,.7)}
.demo-row code{font-family:monospace;color:rgba(127,119,221,.8)}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="brand">
    <div class="brand-logo">🏥</div>
    <div class="brand-name">CNC Operating System</div>
    <div class="brand-sub">Clinical Nursing Consultancy · Home Care Division</div>
  </div>
  <div class="card">
    <div class="card-title">Sign in</div>
    <div class="card-sub">Enter your CNC credentials to continue</div>
    <div class="error" id="err"></div>
    <div class="form-group"><label>Email address</label><input type="email" id="email" placeholder="your@cnc.com" autocomplete="email"/></div>
    <div class="form-group"><label>Password</label><input type="password" id="pw" placeholder="••••••••" autocomplete="current-password"/></div>
    <button class="btn-login" onclick="login()">Sign in →</button>
    <div class="demo-hint">
      <p>Demo accounts — click to fill:</p>
      <div class="demo-row" onclick="fill('director@cnc.com','Director2026!')"><span>Clinical Director</span><code>director@cnc.com</code></div>
      <div class="demo-row" onclick="fill('supa@cnc.com','SupervisorA1!')"><span>Supervisor A</span><code>supa@cnc.com</code></div>
      <div class="demo-row" onclick="fill('pnbrown@cnc.com','PN_Brown2026!')"><span>Practical Nurse</span><code>pnbrown@cnc.com</code></div>
    </div>
  </div>
</div>
<script>
function fill(e,p){document.getElementById('email').value=e;document.getElementById('pw').value=p;}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
async function login(){
  const email=document.getElementById('email').value.trim();
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('err');
  err.style.display='none';
  if(!email||!pw){err.textContent='Please enter email and password.';err.style.display='block';return;}
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
    const d=await r.json();
    if(d.ok) window.location.href='/';
    else{err.textContent=d.error||'Login failed.';err.style.display='block';}
  }catch(e){err.textContent='Server error. Please try again.';err.style.display='block';}
}
</script>
</body>
</html>
